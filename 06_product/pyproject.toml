[project]
name = "briefpilot"
version = "0.1.0"
description = "Meeting Ledger: meeting audio or text → confirmable task drafts → task board → automatic reconciliation at the next meeting"
license = {text = "MIT"}
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "anthropic>=0.70",
  "numpy>=1.26",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "httpx>=0.27", "playwright>=1.45"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]
